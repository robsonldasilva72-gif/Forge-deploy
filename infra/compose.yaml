services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_local
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    image: caddy:2-alpine
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/caddy/forge.json"]
    volumes:
      - ./caddy.json:/etc/caddy/forge.json:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    restart: unless-stopped
volumes:
  forge_caddy_data:
  forge_caddy_config:
  forge_postgres:
