name: Docker and Caddy integration
on: workflow_dispatch
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://forge:forge_local@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: docker compose -f infra/compose.yaml up -d --wait
      - run: cargo test -p forge-deploy-worker --test docker_flow -- --ignored --nocapture
      - run: cargo test -p forge-deploy-worker --test platform_flow -- --ignored --nocapture
      - if: always()
        run: docker compose -f infra/compose.yaml logs
      - if: always()
        run: docker compose -f infra/compose.yaml down
