name: Rust and WebAssembly
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_local
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forge:forge_local@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p forge-deploy-db --test persistence -- --ignored
      - run: cargo test -p forge-deploy-worker --test control -- --ignored
      - run: cargo clippy -p forge-deploy-ui --target wasm32-unknown-unknown -- -D warnings
      - run: bash scripts/build-ui.sh
